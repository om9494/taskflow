version: '3.8'

services:
  # ===================================================
  # MongoDB Database Service
  # ===================================================
  mongodb:
    image: mongo:6.0
    container_name: taskflow-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=taskflow
    volumes:
      - mongodb_data:/data/db
    networks:
      - taskflow-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ===================================================
  # Node.js + Express Backend API Service
  # ===================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: taskflow-backend:latest
    container_name: taskflow-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/taskflow
      - NODE_ENV=production
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - taskflow-network

  # ===================================================
  # React + Nginx Frontend Service
  # ===================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: taskflow-frontend:latest
    container_name: taskflow-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:80" # Maps both port 80 and 3000 for convenience
    depends_on:
      - backend
    networks:
      - taskflow-network

# =====================================================
# Internal Network & Persistent Volumes
# =====================================================
networks:
  taskflow-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
