apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  labels:
    app: mongodb
    project: taskflow
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: admin
  MONGO_INITDB_ROOT_PASSWORD: password123
  # Connection string used by backend pods to connect to the internal MongoDB service
  MONGODB_URI: mongodb://admin:password123@mongodb:27017/taskflow?authSource=admin
